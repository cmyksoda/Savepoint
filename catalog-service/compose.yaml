name: savepoint-catalog
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: savepoint-catalog
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_BOOT_TIMEOUT: 10m
      TS_HOSTNAME: savepoint-catalog
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_EXTRA_ARGS: --accept-dns=false
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro,z
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json | grep -q '\"BackendState\": \"Running\"' "]
      interval: 5s
      timeout: 5s
      start_period: 10m
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  catalog:
    build: .
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:?Fill TWITCH_CLIENT_ID in .env}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:?Fill TWITCH_CLIENT_SECRET in .env}
      HOST: 127.0.0.1
      PORT: "8787"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
volumes:
  tailscale-state:
